<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flip Monster Fight</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#101820; font-family:Arial,sans-serif; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; background:#183923; touch-action:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
var W=240,H=320, player, enemies, score, lives, gameOver, target, lastTime=0, spawnClock=0, attackFlash=0, invincible=0, running=true;
var best=0;
try { best=Number(localStorage.getItem('flip_monster_best')||0)||0; } catch(e){}
function resize(){
  W=Math.max(100,window.innerWidth||240); H=Math.max(140,window.innerHeight||320);
  canvas.width=W; canvas.height=H;
  if(player){ player.x=Math.max(12,Math.min(W-12,player.x)); player.y=Math.max(50,Math.min(H-12,player.y)); }
}
function restart(){
  player={x:W/2,y:H/2,r:9,speed:90};
  target={x:player.x,y:player.y}; enemies=[];score=0;lives=3;gameOver=false;spawnClock=1;attackFlash=0;invincible=0;
}
function steer(x,y){
  var rect=canvas.getBoundingClientRect();
  target.x=Math.max(0,Math.min(W,(x-rect.left)*W/rect.width));
  target.y=Math.max(40,Math.min(H,(y-rect.top)*H/rect.height));
}
function attack(){
  if(gameOver){restart();return;}
  if(attackFlash>0) return;
  attackFlash=.22;
  var hit=false;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i],dx=e.x-player.x,dy=e.y-player.y;
    if(dx*dx+dy*dy<43*43){enemies.splice(i,1);score+=10;hit=true;}
  }
  if(score>best){best=score;try{localStorage.setItem('flip_monster_best',String(best));}catch(e){}}
}
canvas.addEventListener('mousemove',function(e){steer(e.clientX,e.clientY);},false);
canvas.addEventListener('click',function(e){attack();},false);
canvas.addEventListener('touchstart',function(e){if(e.touches.length){steer(e.touches[0].clientX,e.touches[0].clientY);}e.preventDefault();}, {passive:false});
canvas.addEventListener('touchmove',function(e){if(e.touches.length){steer(e.touches[0].clientX,e.touches[0].clientY);}e.preventDefault();}, {passive:false});
canvas.addEventListener('touchend',function(e){attack();e.preventDefault();}, {passive:false});
function spawn(){
  var edge=Math.floor(Math.random()*4),x,y;
  if(edge===0){x=8;y=40;} else if(edge===1){x=W-8;y=40+Math.random()*(H-48);} else if(edge===2){x=Math.random()*W;y=H-8;} else {x=8;y=40+Math.random()*(H-48);}
  if(edge===0)x=Math.random()*W;
  enemies.push({x:x,y:y,r:9,speed:24+Math.min(42,score*.15)+Math.random()*12});
}
function update(dt){
  if(gameOver)return;
  attackFlash=Math.max(0,attackFlash-dt); invincible=Math.max(0,invincible-dt);
  var dx=target.x-player.x,dy=target.y-player.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>4){var step=Math.min(dist,player.speed*dt); player.x+=dx/dist*step;player.y+=dy/dist*step;}
  player.x=Math.max(10,Math.min(W-10,player.x)); player.y=Math.max(49,Math.min(H-10,player.y));
  spawnClock-=dt;
  if(spawnClock<=0 && enemies.length<14){spawn(); spawnClock=Math.max(.6,2.2-score*.009);}
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i],vx=player.x-e.x,vy=player.y-e.y,d=Math.sqrt(vx*vx+vy*vy)||1;
    e.x+=(vx/d)*e.speed*dt; e.y+=(vy/d)*e.speed*dt;
    if(d<player.r+e.r && invincible<=0){
      lives--; invincible=1.4; enemies.splice(i,1);
      if(lives<=0){gameOver=true;target.x=player.x;target.y=player.y;} 
    }
  }
}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function draw(){
  ctx.fillStyle='#21492c';ctx.fillRect(0,0,W,H);
  // Subtle grid makes movement easier to judge.
  ctx.strokeStyle='#2a5634';ctx.lineWidth=1;
  for(var x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,38);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=38;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Cursor target is a faint ring; gameplay does not require holding click.
  if(!gameOver){ctx.strokeStyle='#9ccaa1';ctx.lineWidth=1;ctx.beginPath();ctx.arc(target.x,target.y,6,0,Math.PI*2);ctx.stroke();}
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];circle(e.x,e.y,e.r,'#da5c52');circle(e.x-3,e.y-2,2,'#fff');circle(e.x+3,e.y-2,2,'#fff');
    circle(e.x-3,e.y-2,1,'#25151c');circle(e.x+3,e.y-2,1,'#25151c');
  }
  if(attackFlash>0){ctx.globalAlpha=attackFlash/.22*.7;circle(player.x,player.y,43,'#f5d35c');ctx.globalAlpha=1;}
  if(invincible===0 || Math.floor(invincible*10)%2===0){
    circle(player.x,player.y,player.r,'#67c5fa');circle(player.x-3,player.y-2,1.5,'#142433');circle(player.x+3,player.y-2,1.5,'#142433');
  }
  ctx.fillStyle='#101820';ctx.fillRect(0,0,W,38);
  ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.fillText('Score '+score,7,13);
  ctx.textAlign='right';ctx.fillText('Lives '+lives,W-7,13);
  ctx.textAlign='left';ctx.font='10px Arial';ctx.fillStyle='#c5d5de';ctx.fillText('Best '+best,7,29);
  ctx.textAlign='right';ctx.fillText('MOVE cursor  |  CLICK hit',W-7,29);
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,38,W,H-38);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 23px Arial';ctx.fillText('GAME OVER',W/2,H/2-38);
    ctx.font='bold 18px Arial';ctx.fillText('Score: '+score,W/2,H/2-5);
    ctx.font='13px Arial';ctx.fillText('Best: '+best,W/2,H/2+21);
    ctx.fillStyle='#ffe478';ctx.fillText('CLICK TO RESTART',W/2,H/2+56);
  }
}
function frame(time){
  var dt=lastTime?Math.min(.05,(time-lastTime)/1000):0;lastTime=time;
  update(dt);draw();
  if(running) requestAnimationFrame(frame);
}
resize();restart();window.addEventListener('resize',resize,false);
if(window.requestAnimationFrame){requestAnimationFrame(frame);}else{setInterval(function(){update(.033);draw();},33);}
})();
</script>
</body>
</html>
